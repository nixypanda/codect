[workspace]
resolver = "3"
members = [
    "crates/ownai-core",
    "crates/ownai-git",
    "crates/ownai-language-elm",
    "crates/ownai-language-haskell",
    "crates/ownai-language-python",
    "crates/ownai-language-rust",
    "crates/ownai-engine",
    "crates/ownai-tui",
    "crates/ownai-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
# First-party crates.
ownai-core = { path = "crates/ownai-core" }
ownai-git = { path = "crates/ownai-git" }
ownai-language-elm = { path = "crates/ownai-language-elm" }
ownai-language-haskell = { path = "crates/ownai-language-haskell" }
ownai-language-python = { path = "crates/ownai-language-python" }
ownai-language-rust = { path = "crates/ownai-language-rust" }
ownai-engine = { path = "crates/ownai-engine" }
ownai-tui = { path = "crates/ownai-tui" }

# Runtime dependencies.
tree-sitter = "0.27"
tree-sitter-elm = "5.9"
tree-sitter-haskell = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
gix = { version = "0.87", default-features = false, features = [
    "auto-chain-error",
    "revision",
    "sha1",
    "sha256",
    "pack-cache-lru-static",
] }
similar = "3.2"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
bstr = "1"
anstream = "1"
anstyle = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"

# Terminal frontend dependencies. `ratatui` is built without its default
# feature bundle so the enabled feature set stays auditable; the crossterm
# backend is the only backend.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
unicode-width = "0.2"

# Delta-style syntax highlighting. Confined to `ownai-tui`; the pure-Rust
# `fancy-regex` backend avoids an Oniguruma C toolchain, and `two-face` adds
# the bat syntax/theme assets (Elm, Monokai Extended) that delta uses.
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

# Test-only dependencies.
assert_cmd = "2"
predicates = "3"
tempfile = "3"
portable-pty = "0.9"

# Benchmark-only dependency. Confined to `ownai-tui`'s `bench` feature via a
# `required-features` bench target, so it never enters a normal build.
criterion = { version = "0.8", features = ["html_reports"] }
