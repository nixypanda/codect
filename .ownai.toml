# Named areas for studying OwnAI itself. Paths are repo-root-relative and
# literal (no globs). Select with --area/-a, e.g.
#   ownai show --mode signatures --area seams
#   ownai show --mode types --area base --area cli

[areas]
base      = ["crates/base/src"]
git       = ["crates/git/src"]
cli       = ["crates/cli/src"]
languages = [
    "crates/lang-elm/src",
    "crates/lang-haskell/src",
    "crates/lang-python/src",
    "crates/lang-rust/src",
]

seams = [
    "crates/base/src/lib.rs",
    "crates/git/src/lib.rs",
    "crates/lang-elm/src/lib.rs",
    "crates/lang-haskell/src/lib.rs",
    "crates/lang-python/src/lib.rs",
    "crates/lang-rust/src/lib.rs",
    "crates/cli/src/main.rs",
    "crates/cli/src/command.rs",
]
