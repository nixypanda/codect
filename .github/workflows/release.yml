name: Release

# Cutting a release: bump the workspace version and the flake version, then
# push a `vX.Y.Z` tag. See docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against the manifests
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          flake_version="$(sed -n 's/^ *version = "\([^"]*\)";.*/\1/p' flake.nix | head -n1)"
          echo "tag:        $tag"
          echo "Cargo.toml: $cargo_version"
          echo "flake.nix:  $flake_version"
          if [ "$version" != "$cargo_version" ] || [ "$version" != "$flake_version" ]; then
            echo "::error::release version mismatch: tag=$version Cargo.toml=$cargo_version flake.nix=$flake_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  checks:
    name: Required checks
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just check

  build:
    name: Build ${{ matrix.target }}
    needs: [verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          # GitHub-hosted arm64 Linux runners. If this label is ever
          # unavailable, fall back to x86_64 with `cross` for the arm target.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled from the arm64 macOS runner: the SDK supports both
          # architectures.
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --package cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          target="${{ matrix.target }}"
          name="codect-${version}-${target}"
          mkdir -p "dist/${name}"
          cp "target/${target}/release/codect" "dist/${name}/codect"
          cp LICENSE README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          ls -l "dist/${name}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: codect-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: [verify, checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum codect-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/codect-*.tar.gz
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
