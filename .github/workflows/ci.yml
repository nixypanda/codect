name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: CI never writes to the repository or the Actions cache beyond the
# dependency caches the setup actions manage themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Trim dev-profile debug info and drop incremental bookkeeping to cut compile
  # time in CI. Backtraces keep file and line information.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # `--features tui/bench` folds the benchmark lint into this one check pass
      # instead of a second `cargo clippy -p tui --features bench` invocation.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features tui/bench -- -D warnings
      # Builds `target/debug/codect` for the integration tests (via
      # `CARGO_BIN_EXE_codect`), which the Neovim suite below then reuses.
      - name: Test
        run: cargo test --workspace
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.5
      - name: Neovim plugin suite
        run: CODECT_BIN="$PWD/target/debug/codect" nvim --headless -u NONE -l editors/nvim/tests/run.lua
      # Last, because this replaces `target/debug/codect` with the no-TUI build.
      - name: Build without default features
        run: cargo build -p cli --no-default-features
      - name: Assert terminal dependencies are absent
        run: |
          set -euo pipefail
          if cargo tree -p cli --no-default-features | grep -Eq '(ratatui|crossterm|terminal-colorsaurus|syntect|two-face)'; then
            echo "error: terminal dependency leaked into the no-default-features build" >&2
            exit 1
          fi
      # Printed for review: the enabled `gix` feature set is an architectural
      # invariant, audited against TECHNICAL_DESIGN.md section 4.1.
      - name: Audit gix features
        run: cargo tree -e features -p git

  # Independent of `checks`: the bench profile, the `bench` feature, and
  # `criterion` are a separate build graph, so nothing is shared. Runs in
  # parallel, so it only affects wall clock if it outlasts `checks`.
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - name: Bench
        run: cargo bench -p tui --features bench --bench frame
