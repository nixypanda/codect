[package]
name = "ownai-decisions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
test-support = []
# The optional blocking HTTPS TypeSafe provider. Off by default so the base
# crate and any offline build stay free of an HTTP client.
typesafe = ["dep:ureq", "dep:serde"]
# The optional blocking HTTP Laya provider for a local `laya-serve` process.
# Off by default for the same reason as `typesafe`.
laya = ["dep:ureq", "dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true
ureq = { workspace = true, optional = true }

[dev-dependencies]
tiny_http.workspace = true
