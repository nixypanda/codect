[package]
name = "ownai-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Exposes the `#[doc(hidden)]` benchmark façade in `src/bench.rs`. Never enabled
# by default, so a normal build neither compiles it nor pulls `criterion` into
# any target that matters.
bench = []

[dependencies]
ownai-core.workspace = true
ownai-engine.workspace = true
ratatui.workspace = true
crossterm.workspace = true
terminal-colorsaurus.workspace = true
unicode-width.workspace = true
syntect.workspace = true
two-face.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true

[[bench]]
name = "frame"
harness = false
required-features = ["bench"]
