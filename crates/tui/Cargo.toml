[package]
name = "tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["diff"]
# The compare (range) and history (commits) views come from `tui-diff`.
diff = ["dep:tui-diff"]
# Exposes the `#[doc(hidden)]` benchmark façade in `src/bench.rs`; also exposes
# `tui-diff`'s row hook. Never enabled by default, so a normal build neither
# compiles it nor pulls `criterion` into any target that matters.
bench = ["diff", "tui-diff/bench"]

[dependencies]
base.workspace = true
engine.workspace = true
ratatui.workspace = true
unicode-width.workspace = true
tui-core.workspace = true
tui-diff = { workspace = true, optional = true }

[dev-dependencies]
git.workspace = true
tempfile.workspace = true
criterion.workspace = true
tui-core = { workspace = true, features = ["testing"] }

[[bench]]
name = "frame"
harness = false
required-features = ["bench"]

[[example]]
name = "frames"
required-features = ["bench"]
