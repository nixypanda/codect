[package]
name = "ownai-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ownai"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["dep:ownai-tui"]

[dependencies]
ownai-core.workspace = true
ownai-git.workspace = true
ownai-engine.workspace = true
ownai-decisions.workspace = true
ownai-tui = { workspace = true, optional = true }
anstream.workspace = true
anstyle.workspace = true
clap.workspace = true
miette.workspace = true
thiserror.workspace = true

[dev-dependencies]
ownai-language-elm.workspace = true
ownai-language-haskell.workspace = true
ownai-language-python.workspace = true
ownai-language-rust.workspace = true
serde_json.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
portable-pty.workspace = true
